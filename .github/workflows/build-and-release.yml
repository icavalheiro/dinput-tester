name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/DInputTester.csproj

      - name: Build
        run: dotnet build src/DInputTester.csproj -c Release --no-restore

      - name: Compute release metadata
        id: meta
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ github.event.inputs.version }}'.Trim()
            if ([string]::IsNullOrWhiteSpace($version)) {
              throw 'The version input cannot be empty.'
            }
            $tag = "v$version"
          }
          else {
            $tag = '${{ github.ref_name }}'
            if (-not $tag.StartsWith('v')) {
              throw "Tag '$tag' must start with 'v'."
            }
            $version = $tag.Substring(1)
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish win-x64 single-file self-contained
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          dotnet publish src/DInputTester.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=${{ steps.meta.outputs.version }} `
            -o artifacts/win-x64

      - name: Pack release artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $zipName = "DInput-Tester-win-x64-v${{ steps.meta.outputs.version }}.zip"
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath "artifacts/$zipName" -Force
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: package

      - name: Create GitHub Release and upload artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DInput Tester v${{ steps.meta.outputs.version }}
          files: artifacts/${{ steps.package.outputs.zip_name }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
